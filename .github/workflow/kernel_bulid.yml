name: Kernel Build - hero2lte (exynos8890)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - lineage-19.1
    paths-ignore:
      - '**.md'
      - 'Documentation/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel (hero2lte)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: exynos8890-hero2lte_defconfig
      KERNEL_DIR: ${{ github.workspace }}
      CLANG_VERSION: r416183b
      GCC64_BRANCH: android-12.0.0_r1-release
      GCC32_BRANCH: android-12.0.0_r1-release

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lz4 pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-kernel-hero2lte-${{ hashFiles('arch/arm64/configs/exynos8890-hero2lte_defconfig') }}
          max-size: 2G

      - name: Download AOSP Clang (r416183b)
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${CLANG_VERSION}.tar.gz"
          echo "Downloading Clang from: $CLANG_URL"
          curl -fL -o clang.tar.gz "$CLANG_URL"
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          $HOME/clang/bin/clang --version

      - name: Download AOSP GCC 64-bit (binutils/libgcc)
        run: |
          git clone --depth=1 \
            -b ${{ env.GCC64_BRANCH }} \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            $HOME/gcc-64
          $HOME/gcc-64/bin/aarch64-linux-android-gcc --version

      - name: Download AOSP GCC 32-bit (COMPAT_VDSO)
        run: |
          git clone --depth=1 \
            -b ${{ env.GCC32_BRANCH }} \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            $HOME/gcc-32
          $HOME/gcc-32/bin/arm-linux-androideabi-gcc --version

      - name: Configure kernel
        run: |
          export PATH="$HOME/clang/bin:$HOME/gcc-64/bin:$HOME/gcc-32/bin:$PATH"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=$HOME/gcc-64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$HOME/gcc-32/bin/arm-linux-androideabi-
          make O=out ${{ env.DEFCONFIG }}

      - name: Build kernel with verbose logging
        id: build
        continue-on-error: true
        run: |
          export PATH="$HOME/clang/bin:$HOME/gcc-64/bin:$HOME/gcc-32/bin:$PATH"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=$HOME/gcc-64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$HOME/gcc-32/bin/arm-linux-androideabi-
          make O=out -j$(nproc --all) \
            V=1 \
            ​2>&1 | tee build.log

      - name: Check build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "Build failed. Last 200 lines of build.log:"
          tail -n 200 build.log
          exit 1

      - name: Package Image
        if: steps.build.outcome == 'success'
        run: |
          IMAGE="$KERNEL_DIR/out/arch/arm64/boot/Image"
          if [ ! -f "$IMAGE" ]; then
            echo "Error: Image not found at $IMAGE"
            ls -la "$KERNEL_DIR/out/arch/arm64/boot/"
            exit 1
          fi
          cp "$IMAGE" "$KERNEL_DIR/Image"
          ls -lh "$KERNEL_DIR/Image"

      - name: Package DTB (Exynos DTBH format)
        if: steps.build.outcome == 'success'
        run: |
          DTB_DIR="$KERNEL_DIR/out/arch/arm64/boot/dts"
          DTBS=$(find "$DTB_DIR" -name "exynos8890-hero2lte*.dtb" | sort)
          if [ -z "$DTBS" ]; then
            echo "Error: No hero2lte DTB found in $DTB_DIR"
            ls -la "$DTB_DIR"
            exit 1
          fi
          echo "Found DTBs:"
          echo "$DTBS"
          # 优先使用内核树内 dtbtool（如有），否则使用 dtbTool-exynos
          DTBTOOL=""
          if [ -f "$KERNEL_DIR/scripts/dtbTool" ]; then
            DTBTOOL="$KERNEL_DIR/scripts/dtbTool"
          elif command -v dtbTool-exynos &>/dev/null; then
            DTBTOOL="dtbTool-exynos"
          elif command -v dtbTool &>/dev/null; then
            DTBTOOL="dtbTool"
          else
            echo "Warning: No dtbTool found. Uploading raw .dtb files instead."
            mkdir -p "$KERNEL_DIR/dtb-raw"
            cp $DTBS "$KERNEL_DIR/dtb-raw/"
            exit 0
          fi
          "$DTBTOOL" \
            --pagesize 2048 \
            --platform 0x50a6 \
            --subtype 0x217584da \
            -o "$KERNEL_DIR/dtb.img" \
            $DTBS
          ls -lh "$KERNEL_DIR/dtb.img"

      - name: Upload Image
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.run_id }}
          path: ${{ env.KERNEL_DIR }}/Image
          if-no-files-found: error

      - name: Upload DTB / dtb.img
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtb-${{ github.run_id }}
          path: |
            ${{ env.KERNEL_DIR }}/dtb.img
            ${{ env.KERNEL_DIR }}/dtb-raw/
          if-no-files-found: warn

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn

      - name: Upload error log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ github.run_id }}
          path: |
            build.log
            out/.config
          if-no-files-found: warn
